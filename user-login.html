```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wed Studios | User Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0909;
  --card:#131010;
  --text:#f7f1e9;
  --muted:#a69d96;
  --gold:#d7b37a;
  --gold-hover:#e5c898;
  --line:rgba(255,255,255,.10);
  --danger:#d87575;
  --font-serif:"Cormorant Garamond",Georgia,serif;
  --font-sans:"DM Sans",sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(215,179,122,.08),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-wrapper{
  width:100%;
  max-width:440px;
}

.logo{
  text-align:center;
  margin-bottom:35px;
}

.logo h1{
  font-family:var(--font-serif);
  font-size:46px;
  font-weight:600;
  letter-spacing:2px;
}

.logo h1 span{
  color:var(--gold);
}

.logo p{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:3px;
  margin-top:5px;
}

.login-card{
  background:rgba(19,16,16,.94);
  border:1px solid var(--line);
  padding:42px 38px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.eyebrow{
  color:var(--gold);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:3px;
  margin-bottom:10px;
}

.login-card h2{
  font-family:var(--font-serif);
  font-size:38px;
  font-weight:500;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:30px;
}

.field{
  margin-bottom:20px;
}

.field label{
  display:block;
  color:#d9d0c8;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:8px;
}

.field input{
  width:100%;
  padding:14px 15px;
  background:#0d0c0c;
  color:#fff;
  border:1px solid var(--line);
  outline:none;
  font-family:var(--font-sans);
  font-size:14px;
  transition:.3s;
}

.field input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(215,179,122,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  font-size:11px;
}

.login-btn{
  width:100%;
  padding:15px;
  margin-top:5px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:#111;
  font-family:var(--font-sans);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.login-btn:hover{
  background:var(--gold-hover);
  transform:translateY(-1px);
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.error{
  display:none;
  margin-top:18px;
  padding:12px;
  border:1px solid rgba(216,117,117,.3);
  background:rgba(216,117,117,.06);
  color:var(--danger);
  font-size:12px;
  text-align:center;
}

.back{
  text-align:center;
  margin-top:25px;
}

.back a{
  color:var(--muted);
  font-size:12px;
  text-decoration:none;
}

.back a:hover{
  color:var(--gold);
}

.demo-info{
  margin-top:25px;
  padding:15px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

.demo-info strong{
  color:var(--gold);
}

@media(max-width:500px){
  .login-card{
    padding:32px 22px;
  }

  .logo h1{
    font-size:40px;
  }

  .login-card h2{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="login-wrapper">

  <div class="logo">
    <h1>WED <span>STUDIOS</span></h1>
    <p>Staff Portal</p>
  </div>

  <div class="login-card">

    <div class="eyebrow">Team Access</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to manage your assigned work and earnings.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

      <div class="error" id="errorMessage">
        Invalid username or password.
      </div>

    </form>

    <div class="demo-info">
      <strong>Demo accounts</strong><br>
      editor1 / editor123<br>
      editor2 / editor123<br>
      photographer / photo123
    </div>

  </div>

  <div class="back">
    <a href="/">← Back to Wed Studios</a>
  </div>

</div>

<script>

/* --------------------------------
   DEMO USERS
   -------------------------------- */

const users = [
  {
    username: "editor1",
    password: "editor123",
    name: "Video Editor 1",
    role: "Video Editor"
  },
  {
    username: "editor2",
    password: "editor123",
    name: "Video Editor 2",
    role: "Video Editor"
  },
  {
    username: "photographer",
    password: "photo123",
    name: "Photographer",
    role: "Photographer"
  }
];


/* --------------------------------
   PASSWORD SHOW / HIDE
   -------------------------------- */

const passwordInput = document.getElementById("password");
const showPassword = document.getElementById("showPassword");

showPassword.addEventListener("click", () => {

  if(passwordInput.type === "password"){
    passwordInput.type = "text";
    showPassword.textContent = "HIDE";
  }else{
    passwordInput.type = "password";
    showPassword.textContent = "SHOW";
  }

});


/* --------------------------------
   LOGIN
   -------------------------------- */

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const errorMessage = document.getElementById("errorMessage");

loginForm.addEventListener("submit", function(e){

  e.preventDefault();

  errorMessage.style.display = "none";

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "Checking...";

  setTimeout(() => {

    const user = users.find(
      u =>
        u.username === username &&
        u.password === password
    );

    if(user){

      /*
        Temporary login session.

        Later this will be replaced with
        secure Cloudflare D1 authentication.
      */

      sessionStorage.setItem(
        "wedStudiosUser",
        JSON.stringify({
          username: user.username,
          name: user.name,
          role: user.role
        })
      );

      window.location.href = "/user-dashboard.html";

    }else{

      errorMessage.style.display = "block";

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

    }

  },500);

});

</script>

</body>
</html>
