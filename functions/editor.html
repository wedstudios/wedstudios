<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wed Studios | Editor</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0a0909;color:#f7f1e9;font-family:"DM Sans",sans-serif}.main{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{font:700 31px "Cormorant Garamond";letter-spacing:3px}.logo span{color:#d7b37a}.sub{color:#a69d96;font-size:13px}.logout,.gold{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.logout{background:#292525;color:#fff}.gold{background:#d7b37a;color:#17120e;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#131010;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:18px}.stat b{display:block;font-size:26px;margin-top:8px}.muted{color:#a69d96;font-size:13px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-top:18px}.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:11px;border-radius:8px;border:1px solid #302b2a;background:#0b0b0f;color:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:11px 9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}.dow,.day{background:#131010;border:1px solid rgba(255,255,255,.06);min-height:90px;padding:7px}.dow{min-height:auto;text-align:center;color:#a69d96;font-size:12px}.num{color:#d7b37a;font-size:12px}.event{font-size:10px;background:#211b18;border-left:2px solid #d7b37a;padding:4px;margin-top:5px;border-radius:4px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input{padding:10px;background:#0b0b0f;color:#fff;border:1px solid #302b2a;border-radius:8px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}.main{padding:15px}}
</style></head><body><main class="main"><div class="top"><div><div class="logo">WED <span>STUDIOS</span></div><div class="sub" id="welcome"></div></div><button class="logout" onclick="logout()">Logout</button></div><div class="cards"><div class="card stat"><span class="muted">My Projects</span><b id="total">0</b></div><div class="card stat"><span class="muted">Completed</span><b id="done">0</b></div><div class="card stat"><span class="muted">Pending / Progress</span><b id="pending">0</b></div><div class="card stat"><span class="muted">My Amount</span><b id="amount">₹0</b></div></div><div class="grid"><section class="panel"><h3>Add Work</h3><form id="form" class="form"><input id="date" type="date" required><input id="studio" placeholder="Studio / Client" required><input id="project" placeholder="Project" required><input id="type" placeholder="Work type" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required><select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select><button class="gold">Save Work</button><div id="msg" class="muted"></div></form></section><section class="panel"><h3>My Work History</h3><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Project</th><th>Type</th><th>Price</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><section class="panel" style="margin-top:18px"><div class="filters"><input id="month" type="month"><button class="gold" onclick="renderCalendar()">Load Calendar</button><button class="gold" onclick="window.print()">Print</button></div><div id="cal" class="calendar"></div></section></main><script>
const $=x=>document.getElementById(x);const token=localStorage.getItem('wed_token');let me;try{me=JSON.parse(localStorage.getItem('wed_user'))}catch{}if(!token||!me||me.role!=='editor')location.href='/login.html';$('welcome').textContent='Welcome, '+(me?.name||'Editor');const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function mon(){return localDate().slice(0,7)}$('date').value=localDate();$('month').value=mon();
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),...headers()}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const d=await api('/api/works');const w=d.works;$('rows').innerHTML=w.map(x=>`<tr><td>${esc(x.work_date)}</td><td>${esc(x.studio)}</td><td>${esc(x.project)}</td><td>${esc(x.work_type)}</td><td>${money(x.price)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6">No work yet.</td></tr>';$('total').textContent=w.length;$('done').textContent=w.filter(x=>x.status==='Completed').length;$('pending').textContent=w.filter(x=>x.status!=='Completed').length;$('amount').textContent=money(w.reduce((a,x)=>a+Number(x.price||0),0))}
$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Saving...';try{await api('/api/works',{method:'POST',body:JSON.stringify({date:$('date').value,studio:$('studio').value,project:$('project').value,type:$('type').value,price:Number($('price').value),status:$('status').value})});e.target.reset();$('date').value=localDate();$('msg').textContent='Work saved';load();renderCalendar()}catch(err){$('msg').textContent=err.message}};
async function renderCalendar(){const m=$('month').value||mon();const d=await api('/api/works?month='+encodeURIComponent(m));const first=new Date(m+'-01T00:00:00'),start=first.getDay(),days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<start;i++)h+='<div class="day"></div>';for(let day=1;day<=days;day++){const date=m+'-'+String(day).padStart(2,'0');const ev=d.works.filter(x=>x.work_date===date);h+=`<div class="day"><div class="num">${day}</div>${ev.map(x=>`<div class="event">${esc(x.studio)}<br>${esc(x.work_type)} · ${money(x.price)}<br>${esc(x.status)}</div>`).join('')}</div>`}$('cal').innerHTML=h}
function logout(){localStorage.removeItem('wed_token');localStorage.removeItem('wed_user');location.href='/login.html'}load();renderCalendar();
</script></body></html>
