<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wed Studios | Admin</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0a0909;color:#f7f1e9;font-family:"DM Sans",sans-serif}.app{display:flex;min-height:100vh}.side{width:240px;background:#111010;border-right:1px solid rgba(255,255,255,.08);padding:24px;position:fixed;inset:0 auto 0 0}.logo{font:700 29px "Cormorant Garamond";letter-spacing:3px;margin-bottom:35px}.logo span{color:#d7b37a}.nav button{display:block;width:100%;text-align:left;padding:12px 13px;margin:5px 0;border:0;border-radius:9px;background:transparent;color:#b5ada5;cursor:pointer}.nav button.active,.nav button:hover{background:#1c1818;color:#f7f1e9}.logout{position:absolute;bottom:24px;left:24px;right:24px}.main{margin-left:240px;padding:28px;width:calc(100% - 240px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font:600 34px "Cormorant Garamond"}.user{color:#a69d96;font-size:13px}.tab{display:none}.tab.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#131010;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:18px}.stat b{display:block;font-size:26px;margin-top:8px}.muted{color:#a69d96;font-size:13px}.grid2{display:grid;grid-template-columns:360px 1fr;gap:18px}.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:11px;border-radius:8px;border:1px solid #302b2a;background:#0b0b0f;color:#fff}.form button,.gold{padding:11px 15px;border:0;border-radius:8px;background:#d7b37a;color:#17120e;font-weight:700;cursor:pointer}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;font-size:13px}.danger{background:#5b2929;color:#fff;border:0;border-radius:6px;padding:7px 9px;cursor:pointer}.small{background:#292525;color:#fff;border:0;border-radius:6px;padding:7px 9px;cursor:pointer}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input{padding:10px;background:#0b0b0f;color:#fff;border:1px solid #302b2a;border-radius:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow,.day{background:#131010;border:1px solid rgba(255,255,255,.06);min-height:95px;padding:7px}.dow{min-height:auto;text-align:center;color:#a69d96;font-size:12px}.num{font-size:12px;color:#d7b37a}.event{font-size:10px;background:#211b18;border-left:2px solid #d7b37a;padding:4px;margin-top:5px;border-radius:4px}.report{display:none}.reporttable{width:100%;border-collapse:collapse}.reporttable th,.reporttable td{padding:10px;border-bottom:1px solid #2a2523;text-align:left}.printbtn{float:right}@media(max-width:850px){.side{width:70px;padding:14px}.logo{font-size:0}.logo:first-letter{font-size:28px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.logout{left:14px;right:14px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,minmax(65px,1fr));overflow:auto}.day{min-width:65px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.title{font-size:27px}}
@media print{body{background:#fff;color:#000}.side,header,.tab:not(#report){display:none!important}.main{margin:0;width:100%;padding:0}.report{display:block!important}.reporttable th,.reporttable td{color:#000;border-color:#ccc}}
</style></head><body><div class="app"><aside class="side"><div class="logo">WED <span>STUDIOS</span></div><nav class="nav"><button onclick="tab('dashboard')">◆ Dashboard</button><button onclick="tab('users')">◆ Editors</button><button onclick="tab('works')">◆ Work Management</button><button onclick="tab('calendar')">◆ Calendar</button><button onclick="tab('report')">◆ Monthly Report</button></nav><button class="small logout" onclick="logout()">Logout</button></aside><main class="main"><header><div class="title">Admin Dashboard</div><div class="user" id="who"></div></header>
<section id="dashboard" class="tab active"><div class="cards"><div class="card stat"><span class="muted">Total Work</span><b id="sTotal">0</b></div><div class="card stat"><span class="muted">Completed</span><b id="sDone">0</b></div><div class="card stat"><span class="muted">Pending / Progress</span><b id="sPending">0</b></div><div class="card stat"><span class="muted">Total Amount</span><b id="sAmount">₹0</b></div></div></section>
<section id="users" class="tab"><div class="grid2"><div class="panel"><h3>Add Editor</h3><form id="userForm" class="form"><input id="uName" placeholder="Editor name" required><input id="uId" placeholder="User ID (letters/numbers)" required><input id="uPass" type="password" placeholder="Password (6+ chars)" required><select id="uActive"><option value="1">Active</option><option value="0">Inactive</option></select><button class="gold">Add Editor</button><div id="uMsg" class="muted"></div></form></div><div class="panel"><h3>Editors</h3><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>ID</th><th>Status</th><th>Action</th></tr></thead><tbody id="userRows"></tbody></table></div></div></div></section>
<section id="works" class="tab"><div class="grid2"><div class="panel"><h3>Add Work</h3><form id="workForm" class="form"><input id="wDate" type="date" required><select id="wEditor" required></select><input id="wStudio" placeholder="Studio / Client" required><input id="wProject" placeholder="Project" required><input id="wType" placeholder="Work type" required><input id="wPrice" type="number" min="0" step="0.01" placeholder="Price" required><select id="wStatus"><option>Pending</option><option>In Progress</option><option>Completed</option></select><button class="gold">Save Work</button><div id="wMsg" class="muted"></div></form></div><div class="panel"><h3>All Work</h3><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Editor</th><th>Client</th><th>Project</th><th>Type</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody id="workRows"></tbody></table></div></div></div></section>
<section id="calendar" class="tab"><div class="panel"><div class="filters"><input id="calMonth" type="month"><button class="gold" onclick="renderCalendar()">Load</button></div><div id="calendarGrid" class="calendar"></div></div></section>
<section id="report" class="tab"><div class="panel"><button class="gold printbtn" onclick="window.print()">Print Report</button><div class="filters"><input id="repMonth" type="month"><button class="gold" onclick="renderReport()">Load</button></div><h2>Monthly Work Report</h2><div class="tablewrap"><table class="reporttable"><thead><tr><th>Editor</th><th>Projects</th><th>Completed</th><th>Pending/Progress</th><th>Total Amount</th></tr></thead><tbody id="reportRows"></tbody><tfoot id="reportFoot"></tfoot></table></div></div></section>
</main></div><script>
const $=x=>document.getElementById(x);const token=localStorage.getItem('wed_token');let me;try{me=JSON.parse(localStorage.getItem('wed_user'))}catch{}if(!token||!me||me.role!=='admin')location.href='/login.html';$('who').textContent=me?`Logged in: ${me.name}`:'';
const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function month(){return localDate().slice(0,7)}$('wDate').value=localDate();$('calMonth').value=month();$('repMonth').value=month();
function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='users')loadUsers();if(id==='works')loadWorks();if(id==='calendar')renderCalendar();if(id==='report')renderReport()}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),...headers()}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadUsers(){const d=await api('/api/users');$('userRows').innerHTML=d.users.filter(u=>u.role==='editor').map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.id)}</td><td>${u.active?'Active':'Inactive'}</td><td><button class="small" onclick="toggleUser('${esc(u.id)}',${u.active?0:1})">${u.active?'Deactivate':'Activate'}</button> <button class="danger" onclick="deleteUser('${esc(u.id)}')">Delete</button></td></tr>`).join('');$('wEditor').innerHTML=d.users.filter(u=>u.role==='editor'&&u.active).map(u=>`<option value="${esc(u.id)}">${esc(u.name)} (${esc(u.id)})</option>`).join('')||'<option value="">No active editor</option>'}
$('userForm').onsubmit=async e=>{e.preventDefault();$('uMsg').textContent='Saving...';try{await api('/api/users',{method:'POST',body:JSON.stringify({id:$('uId').value,name:$('uName').value,password:$('uPass').value,active:$('uActive').value==='1'})});e.target.reset();$('uActive').value='1';$('uMsg').textContent='Editor added';loadUsers()}catch(err){$('uMsg').textContent=err.message}};
async function toggleUser(id,active){try{await api('/api/users',{method:'PUT',body:JSON.stringify({id,active:!!active})});loadUsers()}catch(e){alert(e.message)}}async function deleteUser(id){if(!confirm('Delete this editor? Their work records will also be deleted.'))return;try{await api('/api/users',{method:'DELETE',body:JSON.stringify({id})});loadUsers();loadWorks()}catch(e){alert(e.message)}}
$('workForm').onsubmit=async e=>{e.preventDefault();$('wMsg').textContent='Saving...';try{await api('/api/works',{method:'POST',body:JSON.stringify({date:$('wDate').value,editor:$('wEditor').value,studio:$('wStudio').value,project:$('wProject').value,type:$('wType').value,price:Number($('wPrice').value),status:$('wStatus').value})});e.target.reset();$('wDate').value=localDate();$('wMsg').textContent='Work saved';loadWorks()}catch(err){$('wMsg').textContent=err.message}};
async function loadWorks(){const d=await api('/api/works');const w=d.works;$('workRows').innerHTML=w.map(x=>`<tr><td>${esc(x.work_date)}</td><td>${esc(x.editor_name)}</td><td>${esc(x.studio)}</td><td>${esc(x.project)}</td><td>${esc(x.work_type)}</td><td>${money(x.price)}</td><td>${esc(x.status)}</td><td><button class="danger" onclick="deleteWork('${esc(x.id)}')">Delete</button></td></tr>`).join('');$('sTotal').textContent=w.length;$('sDone').textContent=w.filter(x=>x.status==='Completed').length;$('sPending').textContent=w.filter(x=>x.status!=='Completed').length;$('sAmount').textContent=money(w.reduce((a,x)=>a+Number(x.price||0),0))}
async function deleteWork(id){if(!confirm('Delete this work record?'))return;try{await api('/api/works',{method:'DELETE',body:JSON.stringify({id})});loadWorks()}catch(e){alert(e.message)}}
async function renderCalendar(){const m=$('calMonth').value||month();const d=await api('/api/works?month='+encodeURIComponent(m));const first=new Date(m+'-01T00:00:00');const start=first.getDay();const days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<start;i++)h+='<div class="day"></div>';for(let day=1;day<=days;day++){const date=m+'-'+String(day).padStart(2,'0');const ev=d.works.filter(x=>x.work_date===date);h+=`<div class="day"><div class="num">${day}</div>${ev.map(x=>`<div class="event"><b>${esc(x.editor_name)}</b><br>${esc(x.studio)} · ${esc(x.work_type)}<br>${money(x.price)}</div>`).join('')}</div>`}$('calendarGrid').innerHTML=h}
async function renderReport(){const m=$('repMonth').value||month();const d=await api('/api/works?month='+encodeURIComponent(m));const map={};d.works.forEach(x=>{if(!map[x.editor_id])map[x.editor_id]={name:x.editor_name,projects:0,done:0,pending:0,amount:0};const a=map[x.editor_id];a.projects++;x.status==='Completed'?a.done++:a.pending++;a.amount+=Number(x.price||0)});let total=0;$('reportRows').innerHTML=Object.values(map).map(a=>{total+=a.amount;return `<tr><td>${esc(a.name)}</td><td>${a.projects}</td><td>${a.done}</td><td>${a.pending}</td><td>${money(a.amount)}</td></tr>`}).join('')||'<tr><td colspan="5">No work this month.</td></tr>';$('reportFoot').innerHTML=`<tr><th colspan="4">Grand Total</th><th>${money(total)}</th></tr>`}
function logout(){localStorage.removeItem('wed_token');localStorage.removeItem('wed_user');location.href='/login.html'}loadUsers();loadWorks();
</script></body></html>
