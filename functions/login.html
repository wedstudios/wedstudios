<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wed Studios | Login</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0909;color:#f7f1e9;font-family:"DM Sans",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#131010;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:34px;box-shadow:0 30px 80px #0008}.logo{text-align:center;font:700 36px "Cormorant Garamond";letter-spacing:4px}.logo span{color:#d7b37a}.sub{text-align:center;color:#a69d96;margin:4px 0 28px}.field{margin:15px 0}.field label{display:block;font-size:13px;color:#bdb4ac;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#0b0b0f;color:#fff;outline:none}.field input:focus{border-color:#d7b37a}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#d7b37a;color:#17120e;font-weight:700;cursor:pointer}.msg{min-height:22px;text-align:center;color:#e6a6a6;margin-top:14px}.hint{margin-top:22px;padding:12px;border-radius:10px;background:#0b0b0f;color:#9f9790;font-size:12px;line-height:1.6}.back{text-align:center;margin-top:20px}.back a{color:#d7b37a;text-decoration:none}
</style></head><body><main class="card"><div class="logo">WED <span>STUDIOS</span></div><div class="sub">Studio Management Login</div><form id="form"><div class="field"><label>User ID</label><input id="id" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">Sign In</button><div id="msg" class="msg"></div></form><div class="hint">First-time setup: after your D1 database is empty, <b>admin / admin123</b> will automatically create the first Admin account. Change the password/authentication implementation before production use.</div><div class="back"><a href="/">← Back to website</a></div></main><script>
const $=id=>document.getElementById(id);if(localStorage.getItem('wed_token')){try{const u=JSON.parse(localStorage.getItem('wed_user'));if(u) location.href=u.role==='admin'?'/admin.html':'/editor.html'}catch{}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Signing in...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('id').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');localStorage.setItem('wed_token',d.token);localStorage.setItem('wed_user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'/admin.html':'/editor.html'}catch(err){$('msg').textContent=err.message}});
</script></body></html>
